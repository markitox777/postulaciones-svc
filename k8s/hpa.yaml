apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: postulaciones-svc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: postulaciones-svc
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
