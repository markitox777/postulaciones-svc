
name: CI - Postulaciones

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-analyze:
    name: Pruebas, SonarQube y Docker
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Comprobar que existe SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN está disponible"
          else
            echo "SONAR_TOKEN no está disponible"
            exit 1
          fi

      - name: Ejecutar pruebas y analizar codigo
        run: >
          mvn -B clean verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=markitox777
          -Dsonar.projectKey=markitox777_postulaciones-svc
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Validar Docker Compose
        if: success() && github.event_name == 'push'
        run: docker compose config --quiet

      - name: Construir y desplegar aplicacion
        if: success() && github.event_name == 'push'
        run: docker compose up --build -d

      - name: Comprobar respuesta de Swagger
        if: success() && github.event_name == 'push'
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://localhost:8080/swagger-ui/index.html \
              -o /dev/null; then
              echo "Despliegue correcto: Swagger responde"
              exit 0
            fi

            echo "Esperando que la aplicacion inicie... intento $i de 30"
            sleep 5
          done

          echo "Error: la aplicacion no respondio a tiempo"
          docker compose logs
          exit 1

      - name: Detener contenedores de prueba
        if: always() && github.event_name == 'push'
        run: docker compose down --remove-orphans
