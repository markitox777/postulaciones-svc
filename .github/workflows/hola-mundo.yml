
name: CI - Postulaciones

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-analyze:
    name: Pruebas y SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Comprobar que existe SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN está disponible"
          else
            echo "SONAR_TOKEN no está disponible"
            exit 1
          fi

      - name: Ejecutar pruebas y analizar codigo
        run: >
          mvn -B clean verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=markitox777
          -Dsonar.projectKey=markitox777_postulaciones-svc
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Construir imagen Docker
        if: success() && github.event_name == 'push'
        run: docker build -t postulaciones-svc:${{ github.sha }} .

      - name: Verificar Docker Compose
        if: success() && github.event_name == 'push'
        run: docker compose config --quiet
