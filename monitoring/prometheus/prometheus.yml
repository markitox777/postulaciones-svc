
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "postulaciones-svc"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["postulaciones-svc:8080"]

  - job_name: "ci-cd-metrics"
    static_configs:
      - targets: ["ci-metrics-exporter:9100"]
